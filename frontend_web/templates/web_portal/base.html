<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}水稻病虫害检测{% endblock %}</title>
    <style>
        :root { --bg: #f5faef; --paper: rgba(255,255,255,0.95); --ink: #173126; --green: #2d6a3d; --green-soft: #e9f4e4; --line: #d5e4d0; --gold: #d6ad57; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Microsoft YaHei", sans-serif; background:
            radial-gradient(circle at 0% 0%, rgba(205, 230, 179, 0.62), transparent 18%),
            radial-gradient(circle at 100% 5%, rgba(191, 220, 177, 0.48), transparent 18%),
            linear-gradient(180deg, #eef6e7 0%, #f9fcf5 48%, #f1f7eb 100%); color: var(--ink); }
        a { color: var(--green); text-decoration: none; }
        .wrap { max-width: 1180px; margin: 0 auto; padding: 24px; }
        .nav { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0 24px; margin-bottom: 6px; }
        .nav-shell { display:flex; justify-content:space-between; align-items:center; gap:18px; width:100%; padding: 16px 18px; border-radius: 24px; background: rgba(255,255,255,0.72); border: 1px solid rgba(213,228,208,0.88); backdrop-filter: blur(10px); box-shadow: 0 12px 28px rgba(61, 104, 60, 0.06); }
        .nav-links { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
        .nav-link { position: relative; color: #30523f; font-size: 14px; padding: 6px 0; }
        .nav-link::after { content:""; position:absolute; left:0; bottom:-2px; width:0; height:2px; background: linear-gradient(90deg, var(--green), var(--gold)); transition: width .18s ease; }
        .nav-link:hover::after { width:100%; }
        .brand { font-size: 24px; font-weight: 700; color: var(--ink); letter-spacing: 0.02em; }
        .brand-mark { display:inline-flex; align-items:center; gap:10px; }
        .brand-dot { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, var(--green), var(--gold)); box-shadow: 0 0 0 6px rgba(45,106,61,0.08); }
        .card { background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 24px; box-shadow: 0 18px 44px rgba(61, 104, 60, 0.08); }
        .grid { display: grid; gap: 18px; }
        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
        .btn { display: inline-block; border: 0; border-radius: 999px; padding: 12px 18px; background: linear-gradient(135deg, var(--green), #427b4b); color: #fff; cursor: pointer; box-shadow: 0 12px 24px rgba(45,106,61,0.16); }
        .btn-secondary { background: var(--green-soft); color: var(--ink); box-shadow: none; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-weight: 600; margin-bottom: 6px; }
        .field input, .field textarea, .field select { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: #fbfdf8; }
        .list-item { border: 1px solid var(--line); background: #fbfdf8; border-radius: 18px; padding: 16px; margin-bottom: 12px; }
        .muted { color: #5a705f; }
        .hero { padding: 34px; border-radius: 30px; background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(234,245,226,0.96)); }
        .title { margin: 0 0 8px; font-size: 40px; line-height: 1.2; }
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-top: 18px; }
        .metric { background: #f3f9ee; border-radius: 18px; padding: 18px; }
        .metric strong { font-size: 30px; display: block; margin-bottom: 6px; }
        .errorlist { color: #b42318; margin: 0 0 8px; }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="nav">
            <div class="nav-shell">
            <a class="brand" href="/">
                <span class="brand-mark"><span class="brand-dot"></span><span>Rice Guard</span></span>
            </a>
            <nav class="nav-links">
                <a class="nav-link" href="/web/">网页端</a>
                <a class="nav-link" href="/web/detections/">模型检测</a>
                <a class="nav-link" href="/web/dataset/">数据采集</a>
                {% if request.user.is_authenticated %}
                    <a class="nav-link" href="/web/statistics/">数据统计</a>
                {% endif %}
                <a class="nav-link" href="/dashboard/login/">管理后台</a>
                {% if request.user.is_authenticated %}
                    <span class="muted">{{ request.user.username }}</span>
                    <a class="nav-link" href="/accounts/logout/">退出</a>
                {% else %}
                    <a class="nav-link" href="/accounts/login/">登录</a>
                    <a class="nav-link" href="/accounts/register/">注册</a>
                {% endif %}
            </nav>
            </div>
        </header>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
