<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>水稻病虫害后台登录</title>
    <style>
        body { margin: 0; font-family: "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #f2f8e8, #d9ead3); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 360px; background: rgba(255,255,255,0.95); border-radius: 18px; padding: 32px; box-shadow: 0 20px 48px rgba(36, 90, 34, 0.15); }
        h1 { margin: 0 0 8px; font-size: 28px; color: #1f4d28; }
        p { color: #4d664d; margin-bottom: 20px; }
        label { display: block; margin: 14px 0 6px; color: #22492b; font-weight: 600; }
        input { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1px solid #bfd5bf; }
        button { width: 100%; margin-top: 18px; padding: 12px 16px; background: #2d6a3d; border: 0; border-radius: 12px; color: #fff; font-size: 16px; cursor: pointer; }
        .errorlist { color: #b42318; }
    </style>
</head>
<body>
    <div class="card">
        <h1>管理后台</h1>
        <p>用于查看检测记录、采集数据和模型配置。</p>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <label for="id_username">用户名</label>
            {{ form.username }}
            <label for="id_password">密码</label>
            {{ form.password }}
            <button type="submit">登录</button>
        </form>
    </div>
</body>
</html>
